<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sykam Solutions | Under maintenance</title>
<meta name="description" content="sykamsolutions.com is under maintenance.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1120">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;background:#0a1120;color:#e7eef9;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px;
    background-image:radial-gradient(520px 360px at 50% 30%,rgba(59,160,255,.12),transparent 70%)}
  .tag{display:inline-flex;align-items:center;gap:10px;font-family:ui-monospace,Consolas,monospace;font-size:13px;color:#2dd4bf;margin-bottom:22px}
  .dot{width:8px;height:8px;border-radius:50%;background:#facc15;box-shadow:0 0 0 4px rgba(250,204,21,.18);animation:pulse 1.6s ease-in-out infinite}
  h1{font-size:clamp(30px,5vw,46px);font-weight:600;letter-spacing:-.02em;margin-bottom:12px}
  p{color:#97a6c0;font-size:17px;max-width:460px;margin:0 auto}
  .bar{width:220px;height:3px;border-radius:3px;background:#1f2c47;margin:30px auto 0;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:linear-gradient(90deg,#3ba0ff,#2dd4bf);animation:load 1.8s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.4}}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  @media (prefers-reduced-motion:reduce){.dot,.bar i{animation:none}}
</style>
</head>
<body>
  <main>
    <div class="tag"><span class="dot"></span>status: maintenance</div>
    <h1>Under maintenance</h1>
    <p>sykamsolutions.com is being upgraded. Please check back soon.</p>
    <div class="bar" aria-hidden="true"><i></i></div>
  </main>
</body>
</html>
